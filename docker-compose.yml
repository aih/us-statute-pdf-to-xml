services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: statutes
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d statutes"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      - POSTGRES_URL=postgresql://postgres:password@db:5432/statutes
      - DOCLING_ARTIFACTS_PATH=/root/.cache/docling/models
    volumes:
      - .:/app
      - hf_cache:/root/.cache/huggingface
      - docling_models:/root/.cache/docling
    depends_on:
      db:
        condition: service_healthy
    command: tail -f /dev/null

volumes:
  db_data:
  hf_cache:
  docling_models:
