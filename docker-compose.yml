version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: statutes
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d statutes"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    volumes:
      - .:/app
    environment:
      - POSTGRES_URL=postgresql://postgres:password@db:5432/statutes
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOVINFO_API_KEY=861dPygDW6DkZBGEWA10SbjRcHdbQxgBxyJ7ikHt
    depends_on:
      db:
        condition: service_healthy
    command: tail -f /dev/null # Keep container running

volumes:
  db_data:
