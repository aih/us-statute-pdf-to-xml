[project]
name = "us-statute-pdf-to-xml"
version = "0.1.0"
description = "Pipeline for converting US Statutes at Large PDF to USLM XML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "pypdf>=4.1.0",
    "psycopg2-binary>=2.9.9",
    "docling>=2.1.0",
    "lxml>=5.2.1",
    "anthropic>=0.30.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
