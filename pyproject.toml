[project]
name = "us-statute-pdf-to-xml"
version = "0.2.0"
description = "Pipeline for converting US Statutes at Large PDF to USLM XML"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "docling>=2.1.0",
    "lxml>=5.2.1",
    "anthropic>=1.0",
    "huggingface_hub>=1.0",
    "rapidfuzz>=3.0",
    "pyyaml>=6.0",
    "img2pdf>=0.6.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# CPU OCR engines for the rapidocr and easyocr profiles (pipeline/ocr_engines.py); the versions Docling 2.126 pins.
ocr = [
    "rapidocr>=3.9.1,<4",
    "onnxruntime>=1.7.0,<2",
    "easyocr>=1.7,<2",
    "scikit-image>=0.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["downloader", "benchmark", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs the compose Postgres (POSTGRES_URL) or network access",
]
