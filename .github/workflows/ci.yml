name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies (CPU torch)
        run: uv pip install --system --torch-backend cpu -e ".[dev]"
      - name: Secret scan
        run: |
          ! git grep -nE 'api_key=[A-Za-z0-9]{20,}|GOVINFO_API_KEY=[A-Za-z0-9]{20,}|hf_[A-Za-z0-9]{30,}|sk-ant-[A-Za-z0-9_-]{20,}' -- . ':!.github/workflows/ci.yml'
      - name: Run tests
        run: pytest -m "not integration" -q
